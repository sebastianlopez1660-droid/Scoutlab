<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoutLab · Sebastián López</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ==========================================================================
   ScoutLab · PIEL DE MARCA Sebastián López
   Misma estructura y clases que antes: solo cambian color, tipografía y
   superficies para igualar el panel de entrenamiento
   (#0D0D0D · #8B0D14 · #FFFFFF).
   ========================================================================== */
:root{
  --bg:#0d0d0d;
  --bg2:#141414;
  --paper:#0d0d0d;          /* fondo de página */
  --paper2:#1c1c1c;         /* superficie secundaria */
  --card:#161616;           /* tarjetas */
  --panel3:#242424;         /* estado activo / hover */
  --ink:#f5f5f5;
  --ink-soft:#a8a3a3;
  --muted:#6b6666;
  --line:#2c2c2c;
  --line-soft:#1a1a1a;

  --primary:#8b0d14;        /* rojo de marca, rellenos */
  --primary-dark:#6d0a10;
  --primary-mid:#b0362f;
  --primary-light:rgba(139,13,20,.18);
  --primary-line:rgba(139,13,20,.5);
  --accent:#d9695f;         /* rojo legible sobre oscuro */
  --accent-2:#f0a8a0;
  --accent-light:rgba(139,13,20,.14);
  --danger:#e0435c;
  --danger-light:rgba(224,67,92,.14);

  --sage:#7f9e83;
  --gold:#c99a4b;
  --blue:#4a90d9;
  --teal:#3fb88a;
  --violet:#a355c9;

  --radius:12px;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.8);
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  color-scheme:dark;
  accent-color:var(--primary);
  min-height:100vh;
}
/* trama de cuadrícula del fondo, igual que en el panel de entrenamiento */
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.015em;}
button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
a{color:var(--accent);}
::selection{background:var(--primary-light);}
::placeholder{color:var(--muted);}
.hidden{display:none !important;}

*{scrollbar-color:var(--line) transparent; scrollbar-width:thin;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a;}

/* ---------- topbar (saludo + buscador + tarjeta destacada) ---------- */
.topbar{
  /* degradado de la marca que se funde con el fondo, como la cabecera de una app móvil */
  background:linear-gradient(180deg, rgba(139,13,20,.55) 0%, rgba(139,13,20,.16) 55%, var(--bg) 100%);
  color:var(--ink);
  padding:20px 20px 18px;
  position:relative;
  z-index:1;
}
.topbar-inner{
  max-width:1180px; margin:0 auto;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,440px); gap:22px; align-items:center;
  position:relative; z-index:1;
}
@media(max-width:860px){.topbar-inner{grid-template-columns:minmax(0,1fr); gap:16px;}}
.hero-left{display:flex; flex-direction:column; gap:16px; min-width:0;}
.greet{display:flex; align-items:center; gap:12px; min-width:0;}
.avatar{
  width:46px; height:46px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--paper2); border:2px solid var(--primary-mid);
}
.avatar svg{display:block;}
.greet-title{font-family:var(--font-body); font-weight:700; font-size:17px; color:var(--ink); line-height:1.2;}
.greet-sub{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.searchbar{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.06);
  border-radius:14px; padding:4px 14px;
}
.searchbar:focus-within{border-color:var(--primary-line);}
.searchbar > svg{width:20px; height:20px; color:var(--ink-soft); flex-shrink:0;}
.searchbar input{
  flex:1; min-width:0; border:none; background:transparent; color:var(--ink);
  font-family:inherit; font-size:14px; padding:10px 0;
}
.searchbar input:focus{outline:none;}
/* la búsqueda se limpia con "Limpiar búsqueda" en el Histórico; sin la × nativa duplicada */
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none;}

/* tarjeta destacada del jugador (equivale a la tarjeta resaltada del diseño) */
.quickstats{min-width:0;}
.hero-card{
  background:linear-gradient(110deg, var(--primary-mid) 0%, var(--primary) 55%, var(--primary-dark) 100%);
  border-radius:16px; padding:16px 18px; color:#fff;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9);
}
.hero-tags{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.hero-tag{
  background:var(--accent); color:#fff; border-radius:7px; padding:2px 9px;
  font-size:10.5px; font-weight:600;
}
.hero-card .save-indicator{color:rgba(255,255,255,.85);}
.hero-main{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px;}
.hero-title{font-weight:700; font-size:17px; line-height:1.25; word-break:break-word;}
.hero-sub{font-size:11.5px; color:rgba(255,255,255,.8); margin-top:2px;}
.hero-num{text-align:right; flex-shrink:0;}
.hero-num .n{font-weight:700; font-size:22px; line-height:1.1;}
.hero-num .n small{font-size:11px; font-weight:500; opacity:.85; margin-left:3px;}

/* ---------- tabs (fila tipo calendario: píldoras con la activa rellena) ---------- */
.tabs{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  overflow-x:auto; white-space:nowrap;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tabs-inner{max-width:1180px; margin:0 auto; display:flex; gap:6px; padding:10px 20px;}
.tab-btn{
  border:none; background:transparent; padding:7px 14px; border-radius:10px;
  color:var(--ink); white-space:nowrap; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:1px; min-width:64px; flex-shrink:0;
  transition:background .15s, color .15s;
}
.tab-btn .tab-n{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);}
.tab-btn .tab-l{font-size:13px; font-weight:600;}
.tab-btn:hover{background:var(--paper2);}
.tab-btn.active{background:var(--primary); color:#fff;}
.tab-btn.active .tab-n{color:var(--accent-2);}

.container{max-width:1180px; margin:0 auto; padding:22px 20px 80px; position:relative; z-index:1;}

/* ---------- generic components ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
}
.card h2{font-size:16px; margin-bottom:4px;}
.card .sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:14px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:780px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

label{
  display:block; font-size:10.5px; font-weight:400; color:var(--muted); margin-bottom:6px;
  text-transform:uppercase; letter-spacing:.11em; font-family:var(--font-mono);
}
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13.5px; background:var(--paper2); color:var(--ink);
}
input:focus, select:focus, textarea:focus, button:focus-visible{
  outline:2px solid var(--primary-line); outline-offset:1px;
}
option{background:var(--paper2); color:var(--ink);}
.field{margin-bottom:2px;}
.btn{
  border:1px solid var(--primary); background:var(--primary); color:#fff; padding:9px 16px;
  border-radius:10px; font-weight:600; font-size:13px; font-family:var(--font-body);
  transition:all .15s;
}
.btn:hover{background:var(--primary-dark); border-color:var(--primary-dark);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--primary-light); color:var(--accent-2); border-color:var(--primary-line);}
.btn.secondary:hover{background:var(--panel3); border-color:var(--primary);}
.btn.ghost{background:var(--paper2); color:var(--ink-soft); border-color:var(--line);}
.btn.ghost:hover{background:var(--panel3); color:var(--ink); border-color:var(--primary-line);}
.btn.danger{background:var(--paper2); color:var(--danger); border-color:rgba(224,67,92,.45);}
.btn.danger:hover{background:var(--danger-light); border-color:var(--danger);}
.btn.small{padding:6px 11px; font-size:11.5px;}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px;
  font-size:10.5px; font-weight:400; font-family:var(--font-mono); letter-spacing:.04em;
  border:1px solid transparent;
}
.pill.best{background:var(--primary); color:#fff; border-color:var(--primary);}
.pill.alt{background:rgba(74,144,217,.14); color:var(--blue); border-color:rgba(74,144,217,.45);}
.pill.dev{background:var(--panel3); color:var(--ink-soft); border-color:var(--line);}
.pill.none{background:transparent; color:var(--muted); border-color:var(--line);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line);
  font-weight:400;
}
td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}
.num-cell{font-family:var(--font-mono); font-weight:500; text-align:right; color:var(--ink);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}

/* lista con avatar circular, al estilo "Popular Teams" del diseño */
.list-rows{display:flex; flex-direction:column;}
.list-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft);}
.list-row:last-child{border-bottom:none;}
.list-avatar{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--primary-mid), var(--primary-dark));
  border:2px solid var(--primary-line);
  color:#fff; font-weight:700; font-size:15px;
}
.list-main{flex:1; min-width:0;}
.list-title{font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-sub{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-end{flex-shrink:0; font-size:16px;}
.divider{border:none; border-top:1px solid var(--line-soft); margin:16px 0;}
.empty{
  text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13px;
  border:1px dashed var(--line); border-radius:10px; background:var(--paper2);
}
.empty b{color:var(--ink); display:block; font-family:var(--font-display); font-size:15px; margin-bottom:6px;}

/* index dial */
.dial-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
.dial{
  width:132px; height:132px; border-radius:50%; position:relative; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:conic-gradient(var(--primary) calc(var(--pct,0)*1%), var(--line) 0);
}
.dial::before{content:""; position:absolute; inset:12px; border-radius:50%; background:var(--card);}
.dial .val{position:relative; z-index:1; text-align:center;}
.dial .val .n{font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--ink); display:block; line-height:1;}
.dial .val .u{
  font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.11em;
  font-family:var(--font-mono);
}

/* evaluation grid */
.pos-block{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; background:var(--card);}
.pos-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px;
  cursor:pointer; background:var(--paper2); flex-wrap:wrap;
  transition:background .15s;
}
.pos-head:hover{background:var(--panel3);}
.pos-head h3{font-size:15px;}
.pos-progress{display:flex; align-items:center; gap:8px;}
.pos-progress .bar{width:90px; height:6px; border-radius:4px; background:var(--line); overflow:hidden;}
.pos-progress .bar > div{height:100%; background:var(--primary-mid);}
.pos-progress span{font-size:11px; color:var(--ink-soft); font-family:var(--font-mono);}
.pos-body{padding:14px 18px 18px; display:none;}
.pos-body.open{display:block;}
.arq-cols{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
@media(max-width:980px){.arq-cols{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.arq-cols{grid-template-columns:1fr;}}
.arq-col-head{
  font-family:var(--font-mono); font-weight:400; font-size:10.5px; text-align:center;
  padding:8px 6px; border-radius:7px; background:var(--primary-light); color:var(--accent-2);
  border:1px solid var(--primary-line);
  margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em;
}
.cat-label{
  grid-column:1/-1; font-family:var(--font-mono); font-size:10px; font-weight:400; text-transform:uppercase;
  letter-spacing:.12em; color:var(--ink-soft); background:var(--panel3); border:1px solid var(--line);
  padding:4px 10px; border-radius:5px; margin:10px 0 4px;
  display:inline-block;
}
.rate-cell{border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:var(--paper2);}
.rate-q{font-size:11.8px; color:var(--ink-soft); margin-bottom:7px; min-height:32px; line-height:1.35;}
.rate-btns{display:flex; gap:3px;}
.rate-btn{
  flex:1; border:1px solid var(--line); background:var(--panel3); color:var(--ink-soft); border-radius:6px;
  font-size:11px; font-weight:500; padding:5px 0; font-family:var(--font-mono); min-width:0;
  transition:all .12s;
}
.rate-btn:hover{border-color:var(--primary-line); color:var(--ink);}
.rate-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.rate-btn.no-btn{flex:1.3; font-size:9.5px;}
.rate-btn.no-btn.active{background:var(--muted); border-color:var(--muted); color:#fff;}

.mode-switch{display:flex; gap:0; border:1px solid var(--primary-line); border-radius:8px; overflow:hidden; width:fit-content;}
.mode-switch button{
  border:none; padding:8px 16px; font-size:12px; font-weight:400; background:var(--paper2);
  color:var(--ink-soft); font-family:var(--font-mono);
}
.mode-switch button:hover{color:var(--ink);}
.mode-switch button.active{background:var(--primary); color:#fff;}

.stat-card{background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.stat-card .lbl{
  font-size:10px; text-transform:uppercase; letter-spacing:.11em; color:var(--muted); margin-bottom:6px;
  font-family:var(--font-mono);
}
.stat-card .val{font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--ink);}

.badge-cat{
  display:inline-block; font-size:9.5px; font-weight:400; padding:2px 8px; border-radius:5px;
  text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono);
  background:var(--paper2); border:1px solid var(--line);
}
.badge-cat.tec{color:var(--teal); border-color:rgba(63,184,138,.45); background:rgba(63,184,138,.12);}
.badge-cat.tac{color:var(--accent); border-color:var(--primary-line); background:var(--primary-light);}
.badge-cat.psi{color:var(--gold); border-color:rgba(201,154,75,.45); background:rgba(201,154,75,.12);}
.badge-cat.fis{color:var(--blue); border-color:rgba(74,144,217,.45); background:rgba(74,144,217,.12);}

.chart-wrap{position:relative; height:280px;}
.two-col{display:grid; grid-template-columns:1.1fr 1fr; gap:18px;}
@media(max-width:860px){.two-col{grid-template-columns:1fr;}}

.save-indicator{font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:6px; font-family:var(--font-mono);}
.save-indicator .dot{width:7px;height:7px;border-radius:50%; background:var(--sage);}

/* toast */
#appToast{
  position:fixed; left:50%; bottom:18px; transform:translate(-50%, 20px);
  background:var(--panel3); color:var(--ink); border:1px solid var(--line);
  padding:11px 18px; border-radius:9px;
  font-size:12.5px; font-weight:400; font-family:var(--font-mono);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  z-index:100; max-width:90vw; text-align:center;
}
#appToast.show{ opacity:1; transform:translate(-50%, 0); }
#appToast.ok{ background:var(--primary-light); border-color:var(--primary-line); color:var(--accent-2); }
#appToast.error{ background:var(--danger-light); border-color:rgba(224,67,92,.5); color:var(--danger); }

/* print-only report (built for jsPDF export, hidden on screen) */
.pdf-source{ position:absolute; left:-9999px; top:0; width:800px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="hero-left">
      <div class="greet" title="ENTRENADOR PERSONAL · ScoutLab — Evaluación, Scouting y Desarrollo de Talento · 8 posiciones · 40 arquetipos · 800 cualidades">
        <span class="avatar"><svg width="28" height="18" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="40,280 95,280 261.4,20 206.4,20" fill="#8B0D14"/><polygon points="135,280 190,280 356.4,20 301.4,20" fill="#8B0D14"/><polygon points="230,280 396.4,20 451.4,20 333,205 460,205 460,280" fill="#8B0D14"/></svg></span>
        <div style="min-width:0;">
          <div class="greet-title">Hola, Sebastián</div>
          <div class="greet-sub">ScoutLab · ¿Listo para evaluar?</div>
        </div>
      </div>
      <form class="searchbar" id="searchForm" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="playerSearch" placeholder="Buscar jugador en el histórico" aria-label="Buscar jugador en el histórico">
      </form>
    </div>
    <div class="quickstats" id="quickstats"></div>
  </div>
</header>
<nav class="tabs"><div class="tabs-inner" id="tabnav"></div></nav>

/* ============================================================
   CORE DATA / COMPUTE ENGINE
   ============================================================ */
const NO_FLAG = "NO";
const CAT_ORDER = ["Técnico","Táctico","Psicológico","Físico"];
const CAT_KEYS = ["tec","tac","psi","fis"];
const CAT_NAMES = {tec:"Técnico", tac:"Táctico", psi:"Psicológico", fis:"Físico"};
const CAT_TO_KEY = {"Técnico":"tec","Táctico":"tac","Psicológico":"psi","Físico":"fis"};
const RANK_CFG = APP_DATA.rankCfg;
const THRESHOLDS = APP_DATA.thresholds;
const AGE_BRACKETS = ["8-10","11-13","14-15"];

function bracketForAge(age){
  if (age === null || age === undefined || isNaN(age)) return "11-13";
  if (age <= 10) return "8-10";
  if (age <= 13) return "11-13";
  return "14-15";
}

function buildIndexes(){
  const byArq = {};
  const byPos = {};
  const byKey = {}; // pos|arq|cat|orden -> quality
  for (const p of APP_DATA.positions){ byPos[p.name] = p.archetypes.slice(); }
  for (const q of APP_DATA.qualities){
    const k = q.pos + "|" + q.arq;
    if (!byArq[k]) byArq[k] = [];
    byArq[k].push(q);
    byKey[q.pos+"|"+q.arq+"|"+q.cat+"|"+q.o] = q;
  }
  for (const k in byArq){ byArq[k].sort((a,b)=>a.seq-b.seq); }
  return { byArq, byPos, byKey };
}
const IDX = buildIndexes();

function numericRating(q, ratings){
  const v = ratings[q.id];
  if (v===undefined || v===null || v==="" || v===NO_FLAG) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function categoryStat(list, ratings){
  let sum=0, count=0, noCount=0;
  for (const q of list){
    const v = ratings[q.id];
    if (v === undefined || v === null || v === "") continue;
    if (v === NO_FLAG){ noCount++; continue; }
    const n = Number(v);
    if (!isNaN(n) && n>=1 && n<=5){ sum+=n; count++; }
  }
  return { avg: count>0 ? sum/count : null, count, noCount };
}

function archetypeResult(pos, arq, ratings, weights){
  const list = IDX.byArq[pos+"|"+arq] || [];
  const byCat = {tec:[], tac:[], psi:[], fis:[]};
  for (const q of list) byCat[CAT_TO_KEY[q.cat]].push(q);
  const cats = {};
  let totalCount=0, totalNO=0;
  for (const ck of CAT_KEYS){
    const st = categoryStat(byCat[ck], ratings);
    cats[ck] = st.avg !== null ? st.avg/5 : null;
    totalCount += st.count; totalNO += st.noCount;
  }
  let num=0, den=0;
  for (const ck of CAT_KEYS){
    if (cats[ck] !== null){ num += cats[ck]*weights[ck]; den += weights[ck]; }
  }
  const global = den>0 ? num/den : null;
  return { pos, arq, ...cats, global, count: totalCount, noCount: totalNO, total: list.length };
}

function allArchetypeResults(ratings, weights){
  const out = [];
  for (const p of APP_DATA.positions){
    for (const a of p.archetypes){
      out.push(archetypeResult(p.name, a, ratings, weights));
    }
  }
  return out;
}

function rankDescending(items, valueFn, scope){
  const groups = {};
  for (const it of items){
    const g = scope ? scope(it) : "__all__";
    if (!groups[g]) groups[g] = [];
    groups[g].push(it);
  }
  const rankMap = new Map();
  for (const g in groups){
    const arr = groups[g].filter(it=>valueFn(it)!==null);
    arr.sort((a,b)=>valueFn(b)-valueFn(a));
    let rank=1;
    for (let i=0;i<arr.length;i++){
      if (i>0 && valueFn(arr[i]) < valueFn(arr[i-1])) rank = i+1;
      rankMap.set(arr[i], rank);
    }
  }
  return rankMap;
}

function classify(rank){
  if (rank === undefined || rank === null) return {label:"Sin datos", icon:"", tone:"none"};
  if (rank <= RANK_CFG.topBest) return {label:"Tu mejor perfil", icon:"🌟", tone:"best"};
  if (rank <= RANK_CFG.topBest + RANK_CFG.topAlt) return {label:"Alternativa con potencial", icon:"👍", tone:"alt"};
  return {label:"En desarrollo", icon:"🌱", tone:"dev"};
}
function semaforo(rank){
  if (rank === undefined || rank === null) return "";
  if (rank <= RANK_CFG.topBest) return "🟢";
  if (rank <= RANK_CFG.topBest + RANK_CFG.topAlt) return "🟡";
  return "🔵";
}

function positionResults(archResults){
  const out = [];
  for (const p of APP_DATA.positions){
    const arqs = archResults.filter(r=>r.pos===p.name);
    const evaluated = arqs.filter(r=>r.count>0);
    if (evaluated.length===0){
      out.push({pos:p.name, score:null, bestArq:null, avg:null, count:0, total: arqs.reduce((s,a)=>s+a.total,0)});
      continue;
    }
    let best = evaluated[0];
    for (const a of evaluated) if (a.global !== null && (best.global===null || a.global>best.global)) best = a;
    const withGlobal = evaluated.filter(a=>a.global!==null);
    const avg = withGlobal.length ? withGlobal.reduce((s,a)=>s+a.global,0)/withGlobal.length : null;
    const count = arqs.reduce((s,a)=>s+a.count,0);
    out.push({pos:p.name, score: best.global, bestArq: best.arq, avg, count, total: arqs.reduce((s,a)=>s+a.total,0)});
  }
  return out;
}

function qualitiesOf(pos, arq){ return IDX.byArq[pos+"|"+arq] || []; }

function topFortalezas(pos, arq, ratings, n){
  n = n || 8;
  const list = qualitiesOf(pos, arq);
  const rated = list.map(q=>({q, nota:numericRating(q, ratings)})).filter(x=>x.nota!==null);
  rated.sort((a,b)=> (b.nota - a.nota) || (b.q.seq - a.q.seq));
  return rated.slice(0, n);
}

// Sorts weakness candidates so Técnico/Táctico issues come first (more coachable /
// stable at this age), then Psicológico/Físico — matching the app's own methodology
// notes. Within each group, weakest (lowest nota) first, ties broken by original order.
const WEAKNESS_PRIORITY_CATS = new Set(['Técnico','Táctico']);
function prioritizedWeakSort(items){
  const pri = items.filter(x=>WEAKNESS_PRIORITY_CATS.has(x.q.cat));
  const rest = items.filter(x=>!WEAKNESS_PRIORITY_CATS.has(x.q.cat));
  const cmp = (a,b)=> (a.nota-b.nota) || (a.seq-b.seq);
  pri.sort(cmp); rest.sort(cmp);
  return pri.concat(rest);
}

// Builds a single ordered pool of {q, nota, seq} across every archetype of a position
// (best archetype first, then quality order within each) — used for "general" views
// that look at the whole position rather than one archetype.
function positionQualityPool(posName, archResultsForPos, ratings){
  const ordered = archResultsForPos.slice().sort((a,b)=>{
    const av = a.global===null ? -Infinity : a.global;
    const bv = b.global===null ? -Infinity : b.global;
    return bv - av;
  });
  let seq = 0;
  const all = [];
  for (const ar of ordered){
    for (const q of qualitiesOf(posName, ar.arq)){
      all.push({ q, nota: numericRating(q, ratings), seq: seq++ });
    }
  }
  return all;
}

function topDebilidades(posName, archResultsForPos, ratings, umbral, n){
  n = n || 8;
  const all = positionQualityPool(posName, archResultsForPos, ratings);
  const weak = all.filter(x=>x.nota!==null && x.nota<=umbral);
  return prioritizedWeakSort(weak).slice(0, n);
}

function buildPlanFromPool(pool, umbral){
  // pool: [{q, nota, seq}] already rated (nota !== null)
  const nonFisico = pool.filter(x=>x.q.cat!=='Físico');
  const mejoraSorted = prioritizedWeakSort(nonFisico);
  const mejora = mejoraSorted.slice(0,6).map(x=>({...x, impacto: x.nota<=umbral
    ? "Alto: cualidad por debajo del umbral de debilidad, su mejora eleva directamente el ajuste al perfil ideal."
    : "Medio: margen de mejora moderado dentro del rol objetivo."}));

  const allDesc = pool.slice().sort((a,b)=> (b.nota-a.nota) || (b.seq-a.seq));
  const potenciacion = allDesc.slice(0,4);
  const mantenimiento = allDesc.slice(4,8);

  return { mejora, potenciacion, mantenimiento };
}

// "Específico": plan basado solo en las 20 cualidades del arquetipo ideal.
function planDesarrollo(pos, arq, ratings, umbral){
  const list = qualitiesOf(pos, arq);
  const pool = list.map(q=>({q, nota:numericRating(q, ratings), seq:q.seq})).filter(x=>x.nota!==null);
  return buildPlanFromPool(pool, umbral);
}

// "General": plan basado en las 100 cualidades de toda la posición (los 5 arquetipos),
// para prioridades transversales que no dependen del rol/arquetipo exacto elegido.
function planDesarrolloGeneral(posName, archResultsForPos, ratings, umbral){
  const pool = positionQualityPool(posName, archResultsForPos, ratings).filter(x=>x.nota!==null);
  return buildPlanFromPool(pool, umbral);
}

function categoryFactors(archResult){
  const vals = CAT_KEYS.map(k=>({k, v:archResult[k]})).filter(x=>x.v!==null);
  if (!vals.length) return [];
  const maxV = Math.max(...vals.map(x=>x.v));
  const minV = Math.min(...vals.map(x=>x.v));
  return vals.map(x=>{
    let tag = "— Estable";
    if (maxV !== minV && x.v === maxV) tag = "⭐ Factor diferencial";
    else if (maxV !== minV && x.v === minV) tag = "⚠ Factor limitante";
    return {cat: CAT_NAMES[x.k], key:x.k, score:x.v, tag};
  });
}

function idealArchetype(state, archResults){
  let pool = archResults.filter(r=>r.global!==null);
  if (state.mode === 'single'){ pool = pool.filter(r=>r.pos===state.singlePos); }
  if (!pool.length) return null;
  let best = pool[0];
  for (const r of pool){ if (r.global > best.global) best = r; }
  return best;
}

/* ============================================================
   MADURACIÓN BIOLÓGICA (PHV) — Método Mirwald et al., 2002
   ============================================================ */
function ageDecimalFromDates(birthDateStr, evalDateStr){
  if (!birthDateStr || !evalDateStr) return null;
  const b = new Date(birthDateStr), e = new Date(evalDateStr);
  if (isNaN(b.getTime()) || isNaN(e.getTime())) return null;
  const days = (e - b) / (1000*60*60*24);
  if (days < 0) return null;
  return days / 365.25;
}

function num(v){
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

// Returns { ageDecimal, legLength, maturityOffset } or null pieces if inputs are incomplete.
function computeMaturity(player, ageDecimalOverride){
  const ageDecimal = ageDecimalOverride !== undefined ? ageDecimalOverride : ageDecimalFromDates(player.birthDate, player.evalDate);
  const h = num(player.heightCm), sh = num(player.sittingHeightCm), w = num(player.weightKg);
  const legLength = (h!==null && sh!==null) ? (h - sh) : null;
  if (ageDecimal===null || h===null || sh===null || w===null || legLength===null || h<=0){
    return { ageDecimal, legLength, maturityOffset: null };
  }
  const whRatio = (w/h)*100;
  let mo;
  if (player.sex === 'F'){
    mo = -9.376 + 0.0001882*(legLength*sh) + 0.0022*(ageDecimal*legLength) + 0.005841*(ageDecimal*sh) - 0.002658*(ageDecimal*w) + 0.07693*whRatio;
  } else {
    mo = -9.236 + 0.0002708*(legLength*sh) - 0.001663*(ageDecimal*legLength) + 0.007216*(ageDecimal*sh) + 0.02292*whRatio;
  }
  return { ageDecimal, legLength, maturityOffset: mo };
}

function maturityStatus(mo){
  if (mo === null || mo === undefined) return null;
  if (mo < -1) return {
    icon:'🌱', tone:'dev', label:'Pre-pico de crecimiento (antes del estirón)',
    note:'El jugador aún no entra en su ventana de estirón. El rendimiento físico actual puede subestimar su potencial futuro — prioriza la técnica y la toma de decisiones, sin forzar comparaciones físicas con compañeros más adelantados.'
  };
  if (mo > 1) return {
    icon:'✅', tone:'best', label:'Post-pico de crecimiento (estirón completado)',
    note:'El jugador ya atravesó su pico de velocidad de crecimiento. Puede tolerar con normalidad mayor carga física y de fuerza en el entrenamiento.'
  };
  return {
    icon:'⚠️', tone:'alt', label:'En estirón (transición puberal)',
    note:'Jugador en ventana crítica de maduración (PHV ±1 año): prioriza la re-adaptación coordinativa sobre la exigencia física esta temporada. Es normal cierta pérdida temporal de coordinación durante esta etapa.'
  };
}

/* ============================================================
   STATE MANAGEMENT + PERSISTENCE
   ============================================================
   Two storage keys only (both personal, never shared):
   1) "scoutlab-current" — the evaluation you're actively editing (autosaves periodically).
   2) "scoutlab-db"      — a single key holding the array of ALL saved evaluations (the
      "database"). Reading/writing it is always one call, never one call per record —
      this matters because the storage backend rate-limits requests.
   ============================================================ */
const CURRENT_KEY = "scoutlab-current";
const DB_KEY = "scoutlab-db";
const DEFAULT_POSITION = APP_DATA.positions[0].name;

function defaultState(){
  return {
    player: { name:"", club:"", category:"", birthDate:"", evalDate:"", evaluator:"", foot:"Derecho", sex:"M", mainPos:"",
      heightCm:"", sittingHeightCm:"", weightKg:"" },
    age: 12,
    ageBracket: "11-13",
    mode: "multi",
    singlePos: DEFAULT_POSITION,
    ratings: {},
    openPositions: {},
    db: [],               // cache of saved evaluation records (mirrors the DB_KEY storage value)
    selectedForCompare: {} // id -> true, for the comparison charts
  };
}

let AppState = defaultState();
let saveTimer = null;
let isDirty = false;
let isSaving = false;
let storageAvailable = true;
let storageChecked = false;

/* ---------- lightweight toast (no console spam, one message at a time) ---------- */
function showToast(message, kind){
  let el = document.getElementById("appToast");
  if (!el){
    el = document.createElement("div");
    el.id = "appToast";
    document.body.appendChild(el);
  }
  el.className = "toast " + (kind || "info");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.classList.remove("show"); }, 4200);
}

async function checkStorageAvailability(){
  try{
    if (!window.storage) throw new Error("no storage API");
    const probe = String(Date.now());
    await window.storage.set("scoutlab-ping", probe, false);
    const res = await window.storage.get("scoutlab-ping", false);
    storageAvailable = !!(res && res.value === probe);
  }catch(e){
    storageAvailable = false;
  }
  storageChecked = true;
}

async function loadState(){
  await checkStorageAvailability();
  if (storageAvailable){
    try{
      const res = await window.storage.get(CURRENT_KEY, false);
      if (res && res.value){
        const parsed = JSON.parse(res.value);
        AppState = Object.assign(defaultState(), parsed, { db: [], selectedForCompare: {} });
        if (!AppState.ratings) AppState.ratings = {};
        if (!AppState.openPositions) AppState.openPositions = {};
      }
    }catch(e){ /* first time ever using the app — nothing saved yet, that's fine */ }
    await loadDB();
  }
}

// Called on every rating/field edit: marks the state dirty and (re)starts a long debounce.
// We deliberately do NOT write to storage on every click — only after a pause, on tab
// switches, and before the page closes — to stay well within the storage rate limit.
// Your work always lives in memory regardless of whether the cloud write succeeds, so
// nothing is lost mid-session even if storage is unavailable.
function scheduleSave(){
  isDirty = true;
  if (!storageAvailable && storageChecked){ setSaveIndicator(null); return; }
  setSaveIndicator(false);
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 2500);
}

async function flushSave(){
  if (!isDirty || isSaving || !storageAvailable) return;
  isSaving = true;
  try{
    const toSave = {
      player: AppState.player, age: AppState.age, ageBracket: AppState.ageBracket,
      mode: AppState.mode, singlePos: AppState.singlePos, ratings: AppState.ratings,
      openPositions: AppState.openPositions
    };
    await window.storage.set(CURRENT_KEY, JSON.stringify(toSave), false);
    isDirty = false;
    setSaveIndicator(true);
  }catch(e){
    storageAvailable = false;
    setSaveIndicator(null);
  } finally {
    isSaving = false;
  }
}

async function retryStorageConnection(){
  await checkStorageAvailability();
  if (storageAvailable){
    isDirty = true;
    await flushSave();
    try{ await persistDB(AppState.db); }catch(e){ /* will retry on next explicit save */ }
    showToast("Conexión con el guardado recuperada.", "ok");
  } else {
    showToast("Sigue sin haber conexión con el guardado. Usa la copia de seguridad mientras tanto.", "error");
  }
  renderContent();
  renderQuickstats();
}

function setSaveIndicator(saved){
  const el = document.getElementById("saveIndicator");
  if (!el) return;
  if (saved === null){ el.innerHTML = '<span class="dot" style="background:#6b6666"></span> Guardado local (sin nube)'; return; }
  el.innerHTML = saved
    ? '<span class="dot"></span> Guardado'
    : '<span class="dot" style="background:#c99a4b"></span> Guardando…';
}

/* ---------- Evaluations database (single key, whole array) ---------- */
async function loadDB(){
  try{
    const res = await window.storage.get(DB_KEY, false);
    AppState.db = (res && res.value) ? JSON.parse(res.value) : [];
  }catch(e){
    AppState.db = [];
  }
}

async function persistDB(nextArray){
  await window.storage.set(DB_KEY, JSON.stringify(nextArray), false);
}

// Optimistic: the evaluation is always kept for this session in memory, whether or not
// the cloud write succeeds — so "guardar" never silently does nothing. If the cloud write
// fails we say so clearly and point to the backup file as the safety net.
async function saveEvaluationToDB(label){
  const record = {
    id: uid(),
    ts: new Date().toISOString(),
    label: label || "",
    player: JSON.parse(JSON.stringify(AppState.player)),
    age: AppState.age,
    ageBracket: AppState.ageBracket,
    mode: AppState.mode,
    singlePos: AppState.singlePos,
    ratings: JSON.parse(JSON.stringify(AppState.ratings)),
  };
  const next = [record, ...AppState.db];
  AppState.db = next;
  if (!storageAvailable){
    showToast("Guardada en esta sesión (sin nube). Descarga una copia de seguridad para conservarla.", "error");
    return record;
  }
  try{
    await persistDB(next);
    showToast("Evaluación guardada en la base de datos.", "ok");
  }catch(e){
    storageAvailable = false;
    showToast("Guardada en esta sesión, pero no se pudo sincronizar con la nube. Descarga una copia de seguridad.", "error");
  }
  return record;
}

async function deleteEvaluationFromDB(id){
  const next = AppState.db.filter(r=>r.id!==id);
  AppState.db = next;
  delete AppState.selectedForCompare[id];
  if (!storageAvailable){
    showToast("Eliminada en esta sesión (sin nube).", "ok");
    return true;
  }
  try{
    await persistDB(next);
    showToast("Evaluación eliminada.", "ok");
  }catch(e){
    storageAvailable = false;
    showToast("Eliminada en esta sesión, pero no se pudo sincronizar con la nube.", "error");
  }
  return true;
}

function loadEvaluationIntoCurrent(id){
  const rec = AppState.db.find(r=>r.id===id);
  if (!rec) return false;
  AppState.player = JSON.parse(JSON.stringify(rec.player));
  AppState.age = rec.age;
  AppState.ageBracket = rec.ageBracket;
  AppState.mode = rec.mode;
  AppState.singlePos = rec.singlePos;
  AppState.ratings = JSON.parse(JSON.stringify(rec.ratings));
  AppState.openPositions = {};
  isDirty = true;
  return true;
}

/* ---------- Local backup file (works even when cloud storage doesn't) ---------- */
function exportBackupFile(){
  try{
    const payload = {
      app: "ScoutLab", version: 1, exportedAt: new Date().toISOString(),
      current: {
        player: AppState.player, age: AppState.age, ageBracket: AppState.ageBracket,
        mode: AppState.mode, singlePos: AppState.singlePos, ratings: AppState.ratings
      },
      database: AppState.db
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (AppState.player.name||"scoutlab").trim().replace(/[^a-zA-Z0-9]+/g,"_") || "scoutlab";
    a.href = url;
    a.download = `ScoutLab_backup_${safeName}_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast("Copia de seguridad descargada.", "ok");
  }catch(e){
    showToast("No se pudo generar la copia de seguridad.", "error");
  }
}

function importBackupFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(String(reader.result));
      let added = 0;
      if (Array.isArray(data.database)){
        const existingIds = new Set(AppState.db.map(r=>r.id));
        const merged = AppState.db.slice();
        for (const rec of data.database){
          if (rec && rec.id && !existingIds.has(rec.id)){ merged.push(rec); existingIds.add(rec.id); added++; }
        }
        merged.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
        AppState.db = merged;
      }
      if (data.current && data.current.ratings && Object.keys(data.current.ratings).length){
        const hasActiveWork = Object.keys(AppState.ratings).length > 0;
        if (!hasActiveWork){
          AppState.player = data.current.player || AppState.player;
          AppState.age = data.current.age || AppState.age;
          AppState.ageBracket = data.current.ageBracket || AppState.ageBracket;
          AppState.mode = data.current.mode || AppState.mode;
          AppState.singlePos = data.current.singlePos || AppState.singlePos;
          AppState.ratings = data.current.ratings;
          isDirty = true;
        } else {
          AppState.db.unshift({
            id: uid(), ts: new Date().toISOString(), label: "Restaurado de copia de seguridad",
            player: data.current.player, age: data.current.age, ageBracket: data.current.ageBracket,
            mode: data.current.mode, singlePos: data.current.singlePos, ratings: data.current.ratings,
          });
          added++;
        }
      }
      if (storageAvailable){ try{ await persistDB(AppState.db); }catch(e){ storageAvailable = false; } }
      renderContent();
      renderQuickstats();
      showToast(added ? `Copia de seguridad cargada (${added} evaluación(es) añadida(s)).` : "Copia de seguridad cargada.", "ok");
    }catch(e){
      showToast("Ese archivo no parece una copia de seguridad válida de ScoutLab.", "error");
    }
  };
  reader.onerror = ()=> showToast("No se pudo leer el archivo.", "error");
  reader.readAsText(file);
}

// Compute the same result shape (ideal archetype + category scores) for any stored record,
// so charts always reflect the current scoring engine — no stale cached numbers.
function summarizeRecord(rec){
  const weights = APP_DATA.weights[rec.ageBracket] || APP_DATA.weights["11-13"];
  const results = allArchetypeResults(rec.ratings, weights);
  const pseudoState = { mode: rec.mode, singlePos: rec.singlePos };
  const ideal = idealArchetype(pseudoState, results);
  return {
    rec,
    ideal,
    index: ideal ? Math.round(ideal.global*100) : null,
    tec: ideal ? ideal.tec : null, tac: ideal ? ideal.tac : null,
    psi: ideal ? ideal.psi : null, fis: ideal ? ideal.fis : null,
  };
}

function activeWeights(){
  return APP_DATA.weights[AppState.ageBracket];
}

/* ============================================================
   UTILS
   ============================================================ */
function pct(x, digits){
  if (x === null || x === undefined) return "—";
  return (x*100).toFixed(digits===undefined?0:digits) + "%";
}
function pct2(x){ return pct(x,1); }
function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if (!iso) return "—";
  try{
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
  }catch(e){ return iso; }
}
function fmtDateTime(iso){
  if (!iso) return "—";
  try{
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'}) + " " +
           d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso; }
}
function catKeyIcon(key){
  return {tec:"⚙", tac:"🧭", psi:"🧠", fis:"⚡"}[key] || "";
}
function uid(){ return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   TAB: EVALUACIÓN
   ============================================================ */
function positionCount(posName){
  let count=0, no=0;
  const arqs = APP_DATA.positions.find(p=>p.name===posName).archetypes;
  for (const a of arqs){
    for (const q of qualitiesOf(posName, a)){
      const v = AppState.ratings[q.id];
      if (v===NO_FLAG) no++;
      else if (v!==undefined && v!==null && v!=="") count++;
    }
  }
  return {count, no, total: arqs.length*20};
}

function renderRateCell(q){
  const v = AppState.ratings[q.id];
  const btns = [1,2,3,4,5].map(n=>`<button class="rate-btn ${v==n?'active':''}" data-act="rate" data-qid="${q.id}" data-val="${n}">${n}</button>`).join("");
  const noBtn = `<button class="rate-btn no-btn ${v===NO_FLAG?'active':''}" data-act="rate" data-qid="${q.id}" data-val="${NO_FLAG}">N/O</button>`;
  return `<div class="rate-cell"><div class="rate-q">${esc(q.t)}</div><div class="rate-btns">${btns}${noBtn}</div></div>`;
}

function renderPositionBlock(posName, forceOpen){
  const arqs = APP_DATA.positions.find(p=>p.name===posName).archetypes;
  const isOpen = forceOpen || AppState.openPositions[posName];
  const {count, no, total} = positionCount(posName);
  const pctWidth = Math.round((count/total)*100);

  let body = "";
  if (isOpen){
    body += `<div class="arq-cols">`;
    for (const a of arqs){ body += `<div class="arq-col-head">${esc(a)}</div>`; }
    for (const cat of CAT_ORDER){
      body += `<div class="cat-label">${cat}</div>`;
      for (let ord=1; ord<=5; ord++){
        for (const a of arqs){
          const q = IDX.byKey[posName+"|"+a+"|"+cat+"|"+ord];
          body += q ? renderRateCell(q) : `<div></div>`;
        }
      }
    }
    body += `</div>`;
  }

  return `
  <div class="pos-block" data-pos="${esc(posName)}">
    <div class="pos-head" data-act="toggle-pos" data-pos="${esc(posName)}">
      <h3>${esc(posName)}</h3>
      <div class="pos-progress">
        <div class="bar"><div style="width:${pctWidth}%"></div></div>
        <span>${count}/${total}${no?` · ${no} N/O`:''}</span>
        <span style="color:var(--muted); font-size:14px;">${isOpen?'▲':'▼'}</span>
      </div>
    </div>
    <div class="pos-body ${isOpen?'open':''}">${body}</div>
  </div>`;
}

function renderEvaluar(){
  const modeNote = AppState.mode==='single'
    ? `<div class="empty" style="text-align:left; padding:14px 18px; margin-bottom:16px;">Modo <b>Posición única</b> activo — evaluando <b>${esc(AppState.singlePos)}</b>. Cambia la posición en la pestaña Configuración.</div>`

  let blocks = "";

  return `

function renderFortalezas(){
  const weights = activeWeights();

  const ideal = idealArchetype(AppState, results);
  if (!ideal) return emptyState("Sin datos todavía", "Califica al menos una cualidad del arquetipo ideal para ver fortalezas y debilidades.");

  const fort = topFortalezas(ideal.pos, ideal.arq, AppState.ratings, 8);
  const posArqs = results.filter(r=>r.pos===ideal.pos);
  const deb = topDebilidades(ideal.pos, posArqs, AppState.ratings, THRESHOLDS.debilidad, 8);
  const factors = categoryFactors(ideal);

  const fortRows = fort.length ? fort.map(f=>`<tr><td>${esc(f.q.t)}</td><td class="num-cell">${f.nota}</td><td><span class="badge-cat ${CAT_TO_KEY[f.q.cat]}">${f.q.cat}</span></td></tr>`).join("")
    : `<tr><td colspan="3" style="color:var(--muted);">Sin cualidades calificadas aún</td></tr>`;

    : `<tr><td colspan="4" style="color:var(--muted);">No se detectaron debilidades (≤ ${THRESHOLDS.debilidad}) en esta posición</td></tr>`;

  return `
  <div class="card">
    <h2>💪 Fortalezas y debilidades</h2>
    <div class="sub">Arquetipo de referencia: <b>${esc(ideal.arq)}</b> · Posición de referencia: <b>${esc(ideal.pos)}</b>. Fortalezas: top 8 del arquetipo ideal. Debilidades: notas ≤ ${THRESHOLDS.debilidad} buscadas en toda la posición (los 5 arquetipos), priorizando lo técnico y táctico sobre lo psicológico y físico.</div>

      <h2>🌟 Top fortalezas</h2>

    </div>
    <div class="card">
      <h2>⚠️ Top debilidades (toda la posición)</h2>
      <div class="tbl-wrap"><table><thead><tr><th>Cualidad</th><th>Nota</th><th>Categoría</th><th>Arquetipo</th></tr></thead><tbody>${debRows}</tbody></table></div>
    </div>
  </div>
  <div class="card">
    <h2>Factores diferenciales y limitantes por categoría</h2>
    <div class="sub">Factor diferencial = categoría con score más alto (ventaja competitiva). Factor limitante = categoría con score más bajo (mayor riesgo de quedar fuera del perfil ideal).</div>
    <div class="tbl-wrap"><table><thead><tr><th>Categoría</th><th>Score</th><th>Clasificación</th></tr></thead>
    <tbody>${factors.map(f=>`<tr><td>${CAT_NAMES[f.key]}</td><td class="num-cell">${pct(f.score)}</td><td>${f.tag}</td></tr>`).join("")}</tbody></table></div>
  </div>
  `;
}

function renderPlan(){
  const weights = activeWeights();
  const results = allArchetypeResults(AppState.ratings, weights);
  const ideal = idealArchetype(AppState, results);
  if (!ideal) return emptyState("Sin datos todavía", "Califica cualidades del arquetipo ideal para generar el plan de desarrollo.");

  const posArqs = results.filter(r=>r.pos===ideal.pos);
  const planGeneral = planDesarrolloGeneral(ideal.pos, posArqs, AppState.ratings, THRESHOLDS.debilidad);
  const planEspecifico = planDesarrollo(ideal.pos, ideal.arq, AppState.ratings, THRESHOLDS.debilidad);

  return `
  <div class="card">
    <div class="section-title">
      <div><h2>📈 Plan de desarrollo</h2>
        <div class="sub">El plan <b>general</b> recoge prioridades transversales a toda la posición <b>${esc(ideal.pos)}</b> (sus 5 arquetipos). El plan <b>específico</b> se centra solo en las cualidades del arquetipo ideal, <b>${esc(ideal.arq)}</b>.</div>
      </div>
      <div class="mode-switch">
        <button data-act="set-plan-subtab" data-val="general" class="${planSubtab==='general'?'active':''}">General (posición)</button>
        <button data-act="set-plan-subtab" data-val="especifico" class="${planSubtab==='especifico'?'active':''}">Específico (${esc(ideal.arq)})</button>
      </div>
    </div>
  </div>
  ${planSubtab==='general'
    ? renderPlanTables(planGeneral, `de toda la posición ${esc(ideal.pos)}`)
    : renderPlanTables(planEspecifico, `del arquetipo ${esc(ideal.arq)}`)}
  `;
}

  const posPool = AppState.mode==='single' ? posResAll.filter(p=>p.pos===AppState.singlePos) : posResAll;
  const rankPos = rankDescending(posPool, p=>p.score);
  const posEvaluated = posPool.filter(p=>p.score!==null).sort((a,b)=>rankPos.get(a)-rankPos.get(b));

  const posRows = posEvaluated.map(p=>{
    const r = rankPos.get(p);
    const cls = classify(r);
    return `<tr><td>${r}</td><td><b>${esc(p.pos)}</b></td><td class="num-cell">${pct(p.score)}</td><td>${esc(p.bestArq)}</td>
      <td><span class="pill ${cls.tone}">${cls.icon} ${cls.label}</span></td>
      <td style="font-size:12.3px; color:var(--ink-soft);">${justificationFor(cls.tone)}</td></tr>`;
  }).join("") || `<tr><td colspan="6" style="color:var(--muted);">Sin datos</td></tr>`;

  const rankInPos = rankDescending(results, r=>r.global, r=>r.pos);
  const archOfIdeal = results.filter(r=>r.pos===ideal.pos && r.global!==null).sort((a,b)=>rankInPos.get(a)-rankInPos.get(b));
  const archRows = archOfIdeal.map(a=>{
    const r = rankInPos.get(a);
    const cls = classify(r);
    return `<tr><td>${r}</td><td><b>${esc(a.arq)}</b></td><td class="num-cell">${pct(a.global)}</td><td><span class="pill ${cls.tone}">${cls.icon} ${cls.label}</span></td></tr>`;
  }).join("") || `<tr><td colspan="4" style="color:var(--muted);">Sin datos</td></tr>`;

  return `
  <div class="card">
    <h2>🧭 Orientación posicional</h2>
    <div class="sub">La posición ideal actual es <b>${esc(ideal.pos)}</b> con un ${pct(ideal.global)} de ajuste. A continuación, el resto de posiciones ordenadas por compatibilidad.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Posición</th><th>Score</th><th>Mejor arquetipo</th><th>Clasificación</th><th>Justificación</th></tr></thead>
      <tbody>${posRows}</tbody>
    </table></div>
  </div>
  <div class="card">
    <h2>Arquetipos alternativos dentro de ${esc(ideal.pos)}</h2>
    <div class="sub">Un arquetipo secundario con score alto sugiere versatilidad de rol dentro de la misma posición.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Arquetipo</th><th>Score</th><th>Clasificación</th></tr></thead>
      <tbody>${archRows}</tbody>
    </table></div>
  </div>
  `;
}

/* ============================================================
   PDF EXPORT — informe para padres
   ============================================================ */
function gatherReportData(player, ageBracket, mode, singlePos, ratings){
  const weights = APP_DATA.weights[ageBracket] || APP_DATA.weights['11-13'];
  const results = allArchetypeResults(ratings, weights);
  const pseudoState = { mode, singlePos };
  const ideal = idealArchetype(pseudoState, results);
  if (!ideal) return null;
  const fort = topFortalezas(ideal.pos, ideal.arq, ratings, 6);
  const plan = planDesarrollo(ideal.pos, ideal.arq, ratings, THRESHOLDS.debilidad);
  const maturity = computeMaturity(player);
  const maturityInfo = maturityStatus(maturity.maturityOffset);
  return { player, ageBracket, ideal, fort, plan, maturityInfo };
}

   WATERMARK ASSET (rasterized brand logo, used in PDF exports)
   ============================================================ */
let watermarkLogoDataUrl = null;
function prepareWatermarkAssets(){
  try{
    const svgMarkup =
      '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">' +
      '<polygon points="40,280 95,280 261.4,20 206.4,20" fill="#8B0D14"/>' +
      '<polygon points="135,280 190,280 356.4,20 301.4,20" fill="#8B0D14"/>' +
      '<polygon points="230,280 396.4,20 451.4,20 333,205 460,205 460,280" fill="#8B0D14"/>' +
      '</svg>';
    const svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function(){
      try{
        const canvas = document.createElement('canvas');
        canvas.width = 960; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        watermarkLogoDataUrl = canvas.toDataURL('image/png');
      }catch(e){ console.warn('No se pudo rasterizar la marca de agua:', e); }
      URL.revokeObjectURL(url);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); };
    img.src = url;
  }catch(e){ console.warn('No se pudo preparar la marca de agua:', e); }
}

function exportCurrentAsPDF(){
  const data = gatherReportData(AppState.player, AppState.ageBracket, AppState.mode, AppState.singlePos, AppState.ratings);
  if (!data){ showToast("Califica al menos una cualidad antes de generar el informe.", "error"); return; }

}

function exportRecordAsPDF(record){
  const data = gatherReportData(record.player, record.ageBracket, record.mode, record.singlePos, record.ratings);
  if (!data){ showToast("Esta evaluación no tiene datos suficientes para generar el informe.", "error"); return; }
  renderPdfDoc(data, record.ts);
}

function renderPdfDoc(data, dateVal){
  if (typeof window.jspdf === 'undefined'){
    showToast("No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.", "error");
    return;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 16;
    const contentW = pageW - margin*2;
    const GREEN=[139,13,20], GREEN_DARK=[92,10,15], INK=[23,24,26], MUTED=[122,122,127], AMBER_DARK=[122,16,21];
    let y = 0;

    function drawWatermark(){
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity:0.07}));
      if (watermarkLogoDataUrl){
        // tiled brand logo across the whole page
        const wmW = 42, wmH = wmW * (300/480);
        const stepX = wmW + 24, stepY = wmH + 24;
        for (let wy = -10; wy < pageH + wmH; wy += stepY){
          for (let wx = -10; wx < pageW + wmW; wx += stepX){
            try{ doc.addImage(watermarkLogoDataUrl, 'PNG', wx, wy, wmW, wmH); }catch(e){}
          }
        }
        // larger centered logo for emphasis
        const bigW = 108, bigH = bigW * (300/480);
        try{ doc.addImage(watermarkLogoDataUrl, 'PNG', (pageW-bigW)/2, (pageH-bigH)/2, bigW, bigH); }catch(e){}
      } else {
        // fallback: text watermark if the logo image wasn't ready in time
        doc.setTextColor(...GREEN);
        doc.setFont('helvetica','bold');
        doc.setFontSize(30);
        const stepY = 55, stepX = 95;
        let row = 0;
        for (let wy = -20; wy < pageH + 40; wy += stepY){
          const offset = (row % 2) * (stepX/2);
          for (let wx = -40 + offset; wx < pageW + 60; wx += stepX){
            doc.text('SCOUTLAB', wx, wy, { angle:35 });
          }
          row++;
        }
        doc.setFontSize(52);
        doc.text('SCOUTLAB', pageW/2, pageH/2, { angle:35, align:'center' });
      }
      doc.restoreGraphicsState();
    }

    function checkBreak(need){
      if (y + need > pageH - 18){ doc.addPage(); y = margin; drawWatermark(); }
    }

    drawWatermark();
    function bulletList(items, getText){
      doc.setFontSize(9.5);
      items.forEach(it=>{
        const lines = doc.splitTextToSize('• ' + getText(it), contentW - 4);
        checkBreak(lines.length*4.6 + 1.5);
        doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
        doc.text(lines, margin+2, y);
        y += lines.length*4.6 + 1.5;
      });
    }

    // header band
    doc.setFillColor(...GREEN);
    doc.rect(0, 0, pageW, 34, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('Informe de Evaluación de Talento', margin, 15);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text('Sebastián López · Entrenador Personal — ScoutLab', margin, 22);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(data.player.name || 'Jugador', margin, 30);

    y = 42;

    // player info grid (2 columns)
    const infoPairs = [
      ['Club / Academia', data.player.club || '—'],
      ['Categoría', data.player.category || '—'],
      ['Posición principal', data.player.mainPos || '—'],
      ['Evaluador', data.player.evaluator || '—'],
      ['Fecha de evaluación', fmtDate(dateVal)],
      ['Tramo de edad', data.ageBracket],
    ];
    const colX = [margin, margin + contentW/2];
    infoPairs.forEach((p,i)=>{
      const cx = colX[i%2];
      const cy = y + Math.floor(i/2)*7;
      doc.setFontSize(9);
      doc.setFont('helvetica','bold'); doc.setTextColor(...MUTED);
      doc.text(p[0].toUpperCase()+':', cx, cy);
      doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
      doc.text(String(p[1]), cx + 40, cy);
    });
    y += Math.ceil(infoPairs.length/2)*7 + 8;

    // main result box
    checkBreak(28);
    doc.setFillColor(238,235,233);
    doc.roundedRect(margin, y, contentW, 24, 2, 2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...INK);
    doc.text(String(Math.round(data.ideal.global*100)), margin+8, y+16);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text('ÍNDICE GLOBAL', margin+8, y+21);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text('Posición ideal: ' + data.ideal.pos, margin+42, y+11);
    doc.setFontSize(10.5);
    doc.text('Arquetipo: ' + data.ideal.arq, margin+42, y+18);
    y += 24 + 10;

    // category bars
    checkBreak(40);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text('Perfil por categoría', margin, y);
    y += 7;
    const cats = [['Técnico', data.ideal.tec],['Táctico', data.ideal.tac],['Psicológico', data.ideal.psi],['Físico', data.ideal.fis]];
    cats.forEach(([label, val])=>{
      checkBreak(9);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
      doc.text(label, margin, y+3.5);
      const barX = margin + 32, barW = contentW - 32 - 16;
      doc.setFillColor(226,223,220);
      doc.roundedRect(barX, y, barW, 4.5, 1, 1, 'F');
      if (val !== null && val > 0){
        doc.setFillColor(...GREEN);
        doc.roundedRect(barX, y, barW * Math.max(0.02, Math.min(1,val)), 4.5, 1, 1, 'F');
      }
      doc.setFont('helvetica','bold');
      doc.text(val===null?'—':Math.round(val*100)+'%', barX+barW+3, y+3.5);
      y += 8;
    });
    y += 5;

    // maturity (PHV) note, if available
    if (data.maturityInfo){
      const noteLines = doc.splitTextToSize(data.maturityInfo.icon + ' ' + data.maturityInfo.label + ' — ' + data.maturityInfo.note, contentW - 6);
      checkBreak(noteLines.length*4.2 + 8);
      doc.setFillColor(241,222,223);
      doc.roundedRect(margin, y, contentW, noteLines.length*4.2 + 5, 2, 2, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(8.3); doc.setTextColor(...AMBER_DARK);
      doc.text(noteLines, margin+3, y+4.5);
      y += noteLines.length*4.2 + 5 + 6;
    }

    // fortalezas
    checkBreak(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...GREEN_DARK);
    doc.text('Fortalezas destacadas', margin, y);
    y += 6.5;
    bulletList(data.fort.slice(0,6), f => f.q.t);
    y += 4;

    // areas de mejora
    checkBreak(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...AMBER_DARK);
    doc.text('Áreas de mejora prioritarias', margin, y);
    y += 6.5;
    bulletList(data.plan.mejora.slice(0,6), m => m.q.t);
    y += 4;

    // plan de desarrollo — a potenciar
    checkBreak(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text('Plan de desarrollo — fortalezas a potenciar', margin, y);
    y += 6.5;
    bulletList(data.plan.potenciacion.slice(0,4), m => m.q.t);

    // footer note
    checkBreak(26);
    y += 5;
    doc.setDrawColor(226,223,220);
    doc.line(margin, y, pageW-margin, y);
    y += 6;
    doc.setFont('helvetica','italic'); doc.setFontSize(8.3); doc.setTextColor(...MUTED);
    const note = 'Este informe resume una evaluación de desarrollo en un momento puntual, pensada para acompañar el crecimiento del jugador, no para etiquetarlo. Las notas y prioridades pueden cambiar en próximas evaluaciones a medida que el jugador crece y entrena.';
    doc.text(doc.splitTextToSize(note, contentW), margin, y);

    const safeName = (data.player.name || 'jugador').trim().replace(/[^a-zA-Z0-9]+/g,'_') || 'jugador';
    doc.save('Informe_' + safeName + '.pdf');
    showToast('Informe PDF generado y descargado.', 'ok');
  }catch(e){
    console.warn('Error generando PDF:', e);
    showToast('No se pudo generar el PDF.', 'error');
  }
}

/* ============================================================
   POST-RENDER HOOK (charts that need DOM canvas after innerHTML set)
   ============================================================ */
function afterRenderHook(){
  if (activeTab === 'radar'){
    const weights = activeWeights();
    const results = allArchetypeResults(AppState.ratings, weights);
    const ideal = idealArchetype(AppState, results);
    if (ideal) drawRadarChart(ideal);
  }
  if (activeTab === 'historial'){
    drawHistoryCharts();
  }
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function setByPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for (let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

function bindGlobalEvents(){
  document.getElementById("tabnav").addEventListener("click", (e)=>{
    const btn = e.target.closest("[data-tab]");
    if (!btn) return;
    switchTab(btn.getAttribute("data-tab"));
  });

  // Buscador: filtra el histórico por jugador o etiqueta; Enter lleva a la pestaña Histórico.
  const search = document.getElementById("playerSearch");
  search.addEventListener("input", ()=>{
    historySearch = search.value;
    if (activeTab === "historial") renderContent();
  });
  document.getElementById("searchForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    historySearch = search.value;
    if (activeTab === "historial") renderContent();
    else switchTab("historial");
  });

  const content = document.getElementById("content");

  content.addEventListener("click", (e)=>{
    const rateBtn = e.target.closest('[data-act="rate"]');
    if (rateBtn){
      const qid = rateBtn.getAttribute("data-qid");
      const val = rateBtn.getAttribute("data-val");
      const cur = AppState.ratings[qid];
      const curStr = cur===undefined||cur===null ? "" : String(cur);
      if (curStr === val){
        delete AppState.ratings[qid];
      } else {
        AppState.ratings[qid] = (val === NO_FLAG) ? NO_FLAG : Number(val);
      }
      // update just this cell's buttons + the position progress bar (lightweight)
      const cellWrap = rateBtn.closest('.rate-cell');
      cellWrap.querySelectorAll('.rate-btn').forEach(b=>b.classList.remove('active'));
      if (curStr !== val){ rateBtn.classList.add('active'); }
      const posBlock = rateBtn.closest('.pos-block');
      if (posBlock){
        const posName = posBlock.getAttribute('data-pos');
        const {count, no, total} = positionCount(posName);
        const bar = posBlock.querySelector('.pos-progress .bar > div');
        const span = posBlock.querySelector('.pos-progress span');
        if (bar) bar.style.width = Math.round((count/total)*100) + "%";
        if (span) span.textContent = `${count}/${total}${no?` · ${no} N/O`:''}`;
      }
      renderQuickstats();
      scheduleSave();
      return;
    }

    const posHead = e.target.closest('[data-act="toggle-pos"]');
    if (posHead){
      const posName = posHead.getAttribute("data-pos");
      AppState.openPositions[posName] = !AppState.openPositions[posName];
      // re-render just the evaluation tab content to reflect open state
      renderContent();
      scheduleSave();
      return;
    }

    const modeBtn = e.target.closest('[data-act="set-mode"]');
    if (modeBtn){
      AppState.mode = modeBtn.getAttribute("data-val");
      renderContent();
      renderQuickstats();
      scheduleSave();
      return;
    }

    const subtabBtn = e.target.closest('[data-act="set-subtab"]');
    if (subtabBtn){
      resultadosSubtab = subtabBtn.getAttribute("data-val");
      renderContent();
      return;
    }

    const planSubtabBtn = e.target.closest('[data-act="set-plan-subtab"]');
    if (planSubtabBtn){
      planSubtab = planSubtabBtn.getAttribute("data-val");
      renderContent();
      return;
    }

    const pdfCurrentBtn = e.target.closest('[data-act="export-pdf-current"]');
    if (pdfCurrentBtn){
      exportCurrentAsPDF();
      return;
    }

    const pdfRecordBtn = e.target.closest('[data-act="export-pdf-record"]');
    if (pdfRecordBtn){
      const id = pdfRecordBtn.getAttribute("data-id");
      const rec = AppState.db.find(r=>r.id===id);
      if (rec) exportRecordAsPDF(rec);
      return;
    }

    const retryBtn = e.target.closest('[data-act="retry-storage"]');
    if (retryBtn){
      retryStorageConnection();
      return;
    }

    const exportBtn = e.target.closest('[data-act="export-backup"]');
    if (exportBtn){
      exportBackupFile();
      return;
    }

    const importTriggerBtn = e.target.closest('[data-act="import-backup-trigger"]');
    if (importTriggerBtn){
      const input = document.getElementById("backupFileInput");
      if (input) input.click();
      return;
    }

    const saveDbBtn = e.target.closest('[data-act="save-to-db"]');
    if (saveDbBtn && !saveDbBtn.disabled){
      const labelInput = document.getElementById("evalLabel");
      const label = labelInput ? labelInput.value.trim() : "";
      saveEvaluationToDB(label).then(()=>{
        renderContent();
        renderQuickstats();
      });
      return;
    }

    const filterBtn = e.target.closest('[data-act="set-db-filter"]');
    if (filterBtn){
      dbFilterMode = filterBtn.getAttribute("data-val");
      renderContent();
      return;
    }

    if (e.target.closest('[data-act="clear-search"]')){
      historySearch = "";
      document.getElementById("playerSearch").value = "";
      renderContent();
      return;
    }

    const loadBtn = e.target.closest('[data-act="load-eval"]');
    if (loadBtn){
      const id = loadBtn.getAttribute("data-id");
      if (armedLoadId === id){
        armedDeleteId = null;
        if (loadEvaluationIntoCurrent(id)){
          armedLoadId = null;
          renderQuickstats();
          switchTab("evaluar");
          scheduleSave();
        }
      } else {
        armedLoadId = id;
        armedDeleteId = null;
        renderContent();
      }
      return;
    }

    const delEvalBtn = e.target.closest('[data-act="del-eval"]');
    if (delEvalBtn){
      const id = delEvalBtn.getAttribute("data-id");
      if (armedDeleteId === id){
        armedLoadId = null;
        deleteEvaluationFromDB(id).then(()=>{
          armedDeleteId = null;
          renderContent();
          renderQuickstats();
        });
      } else {
        armedDeleteId = id;
        armedLoadId = null;
        renderContent();
      }
      return;
    }
  });

  content.addEventListener("change", (e)=>{
    if (e.target.id === "backupFileInput"){
      const file = e.target.files && e.target.files[0];
      if (file) importBackupFile(file);
      e.target.value = "";
      return;
    }

    const compareBox = e.target.closest('[data-act="toggle-compare"]');
    if (compareBox){
      const id = compareBox.getAttribute("data-id");
      if (compareBox.checked){ AppState.selectedForCompare[id] = true; }
      else { delete AppState.selectedForCompare[id]; }
      renderContent();
      return;
    }

    const el = e.target.closest("[data-bind]");
    if (!el) return;
    const path = el.getAttribute("data-bind");
    let value = el.value;
    if (path === "age"){
      value = value === "" ? null : Number(value);
      setByPath(AppState, path, value);
      AppState.ageBracket = bracketForAge(value);
      renderContent();
      renderQuickstats();
      scheduleSave();
      return;
    }
    setByPath(AppState, path, value);
    if (path === "ageBracket" || path === "mode" || path === "singlePos"){
      renderContent();
      renderQuickstats();
    } else if (path.startsWith("player.")) {
      renderQuickstats();
    }
    scheduleSave();
  });

  content.addEventListener("input", (e)=>{
    const el = e.target.closest("[data-bind]");
    if (!el) return;
    if (el.tagName === "SELECT") return; // handled by change
    const path = el.getAttribute("data-bind");
    if (path === "age") return; // handled on change to avoid mid-typing bracket jumps
    let value = el.value;
    setByPath(AppState, path, value);
    if (path === "player.name") renderQuickstats();
    scheduleSave();
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function initApp(){
  await loadState();
  bindGlobalEvents();
  renderTabNav();
  renderQuickstats();
  renderContent();
  prepareWatermarkAssets();

  window.addEventListener("beforeunload", ()=>{ if (isDirty) flushSave(); });
  window.addEventListener("unhandledrejection", (ev)=>{
    console.warn("Promesa no controlada:", ev.reason);
    ev.preventDefault();
  });
}

initApp();
</script>
